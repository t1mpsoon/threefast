# Развёртывание ThreeFast на Render.
#
# Файл читает панель Render: создаёт веб-сервис и базу, связывает их и
# подставляет секреты. Ничего вводить руками, кроме подтверждения, не нужно.
#
# Как запустить: Render → New → Blueprint → выбрать этот репозиторий.

databases:
  - name: threefast-db
    databaseName: threefast
    user: threefast
    plan: free
    region: frankfurt

services:
  - type: web
    name: threefast
    runtime: python
    plan: free
    region: frankfurt
    branch: master
    buildCommand: pip install -r requirements.txt
    # Render передаёт порт в $PORT: без него сервис не откроется.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: APP_TITLE
        value: ThreeFast
      # Ссылка на базу подставляется из блока databases выше.
      - key: DATABASE_URL
        fromDatabase:
          name: threefast-db
          property: connectionString
      # Ключ подписи токенов генерирует Render: в коде и репозитории его нет.
      - key: SECRET_KEY
        generateValue: true
      # Начальные аккаунты создаются при первом старте.
      - key: SEED_ON_STARTUP
        value: "true"
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_STAFF_USERNAME
        value: staff
      - key: SEED_STAFF_PASSWORD
        generateValue: true
      - key: SEED_SUPERADMIN
        value: "true"
      - key: SEED_SUPERADMIN_USERNAME
        value: superadmin
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "true"
